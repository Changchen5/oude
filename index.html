<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="偶得">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"偶得","short_name":"偶得","start_url":".","display":"standalone","orientation":"portrait","background_color":"%23faf7f2","theme_color":"%23faf7f2"}'>
<title>偶得</title>
<style>
:root{
  --bg1:#faf7f2;--bg2:#f1eae1;--card:#fff;
  --fg:#2f2a26;--fg2:#575049;--muted:#9b948c;
  --line:rgba(47,42,38,.075);--line2:rgba(47,42,38,.12);
  --accent:#b8734c;--accent-2:#d59a72;--accent-soft:rgba(184,115,76,.09);
  --shadow:0 1px 2px rgba(47,42,38,.03),0 10px 30px -16px rgba(47,42,38,.14);
  --r-lg:20px;--r-md:14px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  --serif:"Songti SC","Source Han Serif SC",Georgia,serif;
  --kai:"Kaiti SC","STKaiti","KaiTi",serif;
  --yuan:"Yuanti SC","YouYuan","PingFang SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);color:var(--fg);background:linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.app{width:100%;max-width:700px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-bottom:158px;
  min-height:100vh;--editor-size:15.5px;--editor-lineH:1.85;--editor-font:var(--font);}
.app.size-s{--editor-size:14px;--editor-lineH:1.75;}
.app.size-m{--editor-size:15.5px;--editor-lineH:1.85;}
.app.size-l{--editor-size:17.5px;--editor-lineH:1.95;}
.app.font-default{--editor-font:var(--font);}
.app.font-serif{--editor-font:var(--serif);}
.app.font-kai{--editor-font:var(--kai);}
.app.font-yuan{--editor-font:var(--yuan);}
.header{padding:24px 24px 14px;text-align:center;}
.header h1{margin:0;font-family:var(--serif);font-size:clamp(28px,7.5vw,34px);font-weight:700;
  letter-spacing:.28em;text-indent:.28em;}
.header .tagline{margin:9px 0 0;font-size:11.5px;letter-spacing:.32em;text-indent:.32em;color:var(--muted);}
.header-actions{margin-top:15px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.chip-btn{border:1px solid var(--line2);background:rgba(255,255,255,.65);color:var(--fg2);
  padding:7px 16px;border-radius:999px;font-family:inherit;font-size:12.5px;font-weight:700;
  letter-spacing:.06em;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;}
.chip-btn:active{transform:scale(.96);}
.chip-btn .count{display:inline-block;background:var(--accent);color:#fff;min-width:18px;
  padding:0 5px;border-radius:9px;font-size:10.5px;line-height:18px;text-align:center;}
.chip-btn .count:empty{display:none;}
.types-wrap{position:relative;padding:2px 0 10px;}
.types{display:flex;gap:7px;overflow-x:auto;padding:0 24px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.types::-webkit-scrollbar{display:none;}
.types button{flex:none;border:1px solid var(--line2);background:rgba(255,255,255,.6);color:var(--fg2);
  padding:7px 17px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.06em;
  font-family:inherit;cursor:pointer;transition:all .22s;}
.types button.active{background:var(--fg);border-color:var(--fg);color:#faf7f2;}
.controls{padding:0 24px 14px;display:flex;flex-direction:column;gap:9px;}
.tabs{display:flex;gap:4px;background:rgba(47,42,38,.05);padding:4px;border-radius:13px;}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 0;border-radius:10px;
  font-size:13.5px;font-weight:700;font-family:inherit;letter-spacing:.08em;cursor:pointer;transition:all .22s;}
.tabs button.active{background:var(--card);color:var(--accent);box-shadow:0 2px 8px -3px rgba(47,42,38,.18);}
.counts{display:flex;align-items:center;justify-content:center;gap:5px;}
.counts.hide{display:none;}
.counts .lbl{font-size:11.5px;color:var(--muted);letter-spacing:.15em;margin-right:3px;}
.counts button{width:36px;height:29px;border-radius:9px;border:1px solid var(--line2);
  background:rgba(255,255,255,.6);color:var(--fg2);font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .2s;}
.counts button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.content{padding:0 24px;display:flex;flex-direction:column;gap:14px;}
.insp-hint{display:none;text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.06em;padding:0 0 2px;}
.insp-hint.show{display:block;}
.insp-hint b{color:var(--accent);font-weight:700;}
.insp{display:flex;flex-direction:column;gap:8px;}
.insp-keywords{background:var(--card);border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;}
.kw-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r-md);
  cursor:pointer;transition:background .2s;user-select:none;border:1px solid transparent;}
.kw-row:active{background:rgba(47,42,38,.03);}
.kw-row.locked{background:var(--accent-soft);border-color:rgba(184,115,76,.22);}
.kw-text{flex:1;font-size:clamp(17px,4.7vw,20px);font-weight:600;letter-spacing:.03em;
  font-family:var(--editor-font);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kw-row.locked .kw-text{color:var(--accent);}
.kw-lock{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  color:rgba(47,42,38,.18);transition:color .22s,transform .22s;}
.kw-row.locked .kw-lock{color:var(--accent);transform:scale(1.08);}
.insp-sentence{background:var(--card);border-radius:var(--r-lg);
  padding:clamp(28px,8vw,44px) clamp(22px,6vw,34px);box-shadow:var(--shadow);text-align:center;
  font-family:var(--editor-font);font-size:clamp(17px,4.9vw,21px);line-height:1.9;letter-spacing:.04em;position:relative;}
.insp-sentence::before{content:"";position:absolute;left:50%;top:0;transform:translate(-50%,-1px);
  width:46px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--accent-2),transparent);}
@keyframes popIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
.pop>*{animation:popIn .34s cubic-bezier(.2,.8,.3,1) backwards;}
.pop>*:nth-child(1){animation-delay:0s;}
.pop>*:nth-child(2){animation-delay:.045s;}
.pop>*:nth-child(3){animation-delay:.09s;}
.pop>*:nth-child(4){animation-delay:.135s;}
.pop>*:nth-child(5){animation-delay:.18s;}
.pop>*:nth-child(6){animation-delay:.225s;}
.note{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;}
.note-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 11px;gap:8px;flex-wrap:wrap;}
.note-label{font-size:12px;letter-spacing:.24em;color:var(--muted);font-weight:700;flex:none;}
.note-right{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
  letter-spacing:.05em;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;}
.note-right .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.4;flex:none;}
#saveStatus{transition:color .25s,opacity .25s;color:var(--muted);opacity:0;font-size:11px;}
#saveStatus.on{opacity:1;}
#saveStatus.ok{color:var(--accent);}
.mini-btn{border:1px solid var(--line2);background:rgba(255,255,255,.6);color:var(--fg2);
  padding:4px 10px;border-radius:999px;font-family:inherit;font-size:11px;font-weight:700;
  letter-spacing:.06em;cursor:pointer;transition:all .2s;white-space:nowrap;flex:none;}
.mini-btn:active{transform:scale(.95);}
.mini-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.img-mode{border:1px solid var(--line2);background:rgba(255,255,255,.6);color:var(--muted);
  padding:4px 10px;border-radius:999px;font-family:inherit;font-size:11px;font-weight:700;
  letter-spacing:.06em;cursor:pointer;transition:all .2s;flex:none;}
.img-mode.on{background:var(--accent-soft);border-color:rgba(184,115,76,.35);color:var(--accent);}
.img-mode:active{transform:scale(.95);}
.fmt{display:flex;align-items:center;gap:1px;padding:0 13px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.fmt button{width:36px;height:34px;border:0;background:transparent;color:var(--muted);border-radius:9px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;
  font-size:14px;transition:all .16s;touch-action:manipulation;}
.fmt button:active{transform:scale(.92);}
.fmt button.on{background:var(--accent-soft);color:var(--accent);}
.fmt .vline{width:1px;height:16px;background:var(--line2);margin:0 6px;flex:none;}
.fmt svg{display:block;}
.fmt .ttl{font-weight:800;letter-spacing:0;}
.fmt .ttl.ttl1{font-size:15px;}
.fmt .ttl.ttl2{font-size:12.5px;}
.editor{min-height:160px;padding:16px 18px 20px;font-size:var(--editor-size);line-height:var(--editor-lineH);
  color:var(--fg);outline:none;word-break:break-word;-webkit-user-select:text;user-select:text;
  caret-color:var(--accent);font-family:var(--editor-font);}
.editor:empty::before{content:attr(data-placeholder);color:#c2bcb5;pointer-events:none;}
.editor div,.editor p{margin:0;}
.editor h1{font-family:var(--editor-font);font-size:calc(var(--editor-size)*1.42);font-weight:700;margin:10px 0 4px;line-height:1.45;}
.editor h2{font-family:var(--editor-font);font-size:calc(var(--editor-size)*1.22);font-weight:700;margin:8px 0 3px;line-height:1.5;}
.editor ul,.editor ol{margin:6px 0;padding-left:22px;}
.editor li{margin:2px 0;}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
  padding:14px 0 calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(241,234,225,0),rgba(241,234,225,.94) 42%,rgba(241,234,225,.99));
  pointer-events:none;}
.actions-inner{display:flex;gap:7px;width:100%;max-width:700px;padding:0 20px;pointer-events:auto;}
.btn{border:0;font-family:inherit;font-weight:700;font-size:14px;letter-spacing:.05em;
  padding:15px 4px;border-radius:var(--r-md);cursor:pointer;transition:all .14s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{flex:1.5;background:linear-gradient(180deg,#c8875c,#a8623a);color:#fff;
  box-shadow:0 10px 24px -10px rgba(168,98,58,.75);}
.btn-ghost{flex:1;background:var(--card);color:var(--fg2);box-shadow:var(--shadow);border:1px solid var(--line);}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:var(--fg);color:#faf7f2;font-size:13.5px;font-weight:600;letter-spacing:.08em;
  padding:11px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .24s,transform .24s;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.5);z-index:900;white-space:nowrap;max-width:88vw;
  overflow:hidden;text-overflow:ellipsis;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.modal{position:fixed;inset:0;background:rgba(30,26,22,.72);-webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:18px;
  opacity:0;pointer-events:none;transition:opacity .26s;z-index:200;}
.modal.show{opacity:1;pointer-events:auto;}
.modal-inner{width:100%;max-width:420px;display:flex;flex-direction:column;gap:11px;transform:translateY(10px);transition:transform .3s;}
.modal.show .modal-inner{transform:none;}
.modal-inner img{width:100%;max-height:62vh;object-fit:contain;border-radius:16px;background:#fff;
  box-shadow:0 30px 70px -26px rgba(0,0,0,.7);}
.modal-tip{text-align:center;font-size:12px;color:rgba(255,255,255,.62);letter-spacing:.08em;}
.modal-actions{display:flex;gap:9px;}
.modal-actions a,.modal-actions button{flex:1;text-align:center;text-decoration:none;border:0;
  font-family:inherit;font-weight:700;font-size:15px;letter-spacing:.08em;padding:15px;
  border-radius:var(--r-md);cursor:pointer;transition:all .14s;}
.modal-actions a:active,.modal-actions button:active{transform:scale(.97);}
.m-primary{background:linear-gradient(180deg,#c8875c,#a8623a);color:#fff;}
.m-sub{background:rgba(255,255,255,.14);color:#faf7f2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);}
.loading{position:fixed;inset:0;z-index:250;display:none;align-items:center;justify-content:center;
  background:rgba(30,26,22,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.loading.show{display:flex;}
.loading-box{background:var(--card);border-radius:16px;padding:22px 30px;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.5);display:flex;align-items:center;gap:12px;
  font-size:14px;color:var(--fg2);}
.spin{width:16px;height:16px;border:2px solid rgba(184,115,76,.2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.drawer-mask{position:fixed;inset:0;background:rgba(30,26,22,.4);-webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:390;}
.drawer-mask.show{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,380px);background:var(--card);z-index:400;
  transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;
  box-shadow:-24px 0 70px -30px rgba(47,42,38,.4);padding-top:env(safe-area-inset-top);}
.drawer.show{transform:none;}
.drawer-head{padding:20px 20px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);gap:10px;flex:none;}
.drawer-title{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.22em;text-indent:.22em;}
.drawer-head-actions{display:flex;align-items:center;gap:8px;}
.drawer-new{border:1px solid var(--line2);background:rgba(255,255,255,.6);color:var(--fg2);
  padding:5px 12px;border-radius:999px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;}
.drawer-close{width:30px;height:30px;border-radius:9px;border:0;background:rgba(47,42,38,.06);
  color:var(--fg2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.drawer-list{flex:1;overflow-y:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.draft-item{background:rgba(47,42,38,.028);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:all .18s;}
.draft-item:active{transform:scale(.985);}
.draft-item.active{background:var(--accent-soft);border-color:rgba(184,115,76,.35);}
.draft-title{font-size:14.5px;font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.draft-preview{font-size:12.5px;color:var(--muted);line-height:1.55;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;word-break:break-word;}
.draft-insp{display:inline-block;font-size:10.5px;color:var(--accent);background:var(--accent-soft);
  padding:2px 8px;border-radius:6px;margin-bottom:8px;max-width:100%;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;vertical-align:middle;}
.draft-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);}
.draft-del{color:#c25a4a;padding:3px 10px;border-radius:7px;font-weight:700;cursor:pointer;}
.draft-del:active{background:rgba(194,90,74,.12);}
.drawer-empty{text-align:center;padding:70px 30px;color:var(--muted);font-size:13.5px;line-height:2;}
.drawer-empty span{font-size:11.5px;color:#c2bcb5;}
.confirm-modal{position:fixed;inset:0;z-index:600;background:rgba(30,26,22,.55);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;
  justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .22s;}
.confirm-modal.show{opacity:1;pointer-events:auto;}
.confirm-box{width:100%;max-width:320px;background:var(--card);border-radius:18px;padding:22px;
  box-shadow:0 30px 70px -24px rgba(0,0,0,.55);transform:translateY(8px) scale(.98);transition:transform .26s;}
.confirm-modal.show .confirm-box{transform:none;}
.confirm-msg{margin:0 0 18px;font-size:14.5px;line-height:1.65;text-align:center;}
.confirm-actions{display:flex;gap:9px;}
.confirm-actions button{flex:1;border:0;font-family:inherit;font-weight:700;font-size:14.5px;
  padding:13px;border-radius:12px;cursor:pointer;transition:all .14s;}
.confirm-actions button:active{transform:scale(.97);}
.confirm-cancel{background:rgba(47,42,38,.07);color:var(--fg2);}
.confirm-ok{background:linear-gradient(180deg,#c8875c,#a8623a);color:#fff;}
.lib-modal{position:fixed;inset:0;z-index:500;background:rgba(30,26,22,.55);-webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .25s;}
.lib-modal.show{opacity:1;pointer-events:auto;}
.lib-panel{width:100%;max-width:520px;max-height:92vh;background:var(--card);border-radius:22px;
  display:flex;flex-direction:column;box-shadow:0 30px 80px -26px rgba(0,0,0,.55);
  transform:translateY(10px) scale(.98);transition:transform .28s;overflow:hidden;}
.lib-modal.show .lib-panel{transform:none;}
.lib-head{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);gap:10px;flex:none;}
.lib-title{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.2em;text-indent:.2em;}
.lib-close{width:30px;height:30px;border-radius:9px;border:0;background:rgba(47,42,38,.06);
  color:var(--fg2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.lib-types{display:flex;gap:6px;overflow-x:auto;padding:12px 20px 6px;flex:none;scrollbar-width:none;}
.lib-types::-webkit-scrollbar{display:none;}
.lib-types button{flex:none;border:1px solid var(--line2);background:rgba(255,255,255,.6);color:var(--fg2);
  padding:5px 13px;border-radius:999px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.lib-types button.active{background:var(--fg);border-color:var(--fg);color:#faf7f2;}
.lib-pools{display:flex;gap:5px;overflow-x:auto;padding:4px 20px 10px;flex:none;scrollbar-width:none;
  border-bottom:1px solid var(--line);}
.lib-pools::-webkit-scrollbar{display:none;}
.lib-pools button{flex:none;border:1px solid var(--line2);background:rgba(255,255,255,.6);color:var(--fg2);
  padding:5px 12px;border-radius:9px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.lib-pools button.active{background:var(--accent-soft);border-color:rgba(184,115,76,.35);color:var(--accent);}
.lib-body{flex:1;overflow-y:auto;padding:14px 20px 18px;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:10px;}
.lib-input-wrap{display:flex;gap:8px;align-items:stretch;}
.lib-input{flex:1;min-height:52px;max-height:120px;padding:11px 13px;border-radius:12px;
  border:1px solid var(--line2);background:rgba(47,42,38,.025);color:var(--fg);font-family:inherit;
  font-size:13.5px;line-height:1.5;resize:vertical;outline:none;}
.lib-add{border:0;background:linear-gradient(180deg,#c8875c,#a8623a);color:#fff;padding:0 16px;
  border-radius:12px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;}
.lib-hint{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
.lib-hint b{color:var(--accent);}
.lib-clear{background:transparent;border:0;color:#c25a4a;font-family:inherit;font-size:11.5px;
  font-weight:700;cursor:pointer;padding:3px 8px;border-radius:7px;}
.lib-list{display:flex;flex-wrap:wrap;gap:7px;}
.lib-item{display:inline-flex;align-items:center;gap:7px;background:rgba(47,42,38,.045);
  border:1px solid var(--line);padding:6px 6px 6px 13px;border-radius:999px;font-size:13px;max-width:100%;}
.lib-item span{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

<body>
<div class="app font-default" id="app">
  <header class="header">
    <h1>偶得</h1>
    <p class="tagline">文章本天成 · 妙手偶得之</p>
    <div class="header-actions">
      <button class="chip-btn" id="openDrafts">我的草稿<span class="count" id="draftCount"></span></button>
      <button class="chip-btn" id="openLib">自定义词库</button>
    </div>
  </header>
  <div class="types-wrap"><div class="types" id="types"></div></div>
  <div class="controls">
    <nav class="tabs" id="tabs">
      <button data-mode="keywords" class="active">关键词</button>
      <button data-mode="opening">开头</button>
      <button data-mode="ending">结尾</button>
    </nav>
    <div class="counts" id="counts">
      <span class="lbl">词数</span>
      <button data-n="2">2</button><button data-n="3">3</button>
      <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
    </div>
  </div>
  <div class="content">
    <div class="insp-hint show" id="inspHint">点词可锁定 · <b>锁定的词</b>再摇也不会换</div>
    <div class="insp" id="insp"></div>
    <section class="note">
      <div class="note-head">
        <span class="note-label">便签</span>
        <span class="note-right">
          <span id="saveStatus"></span><span class="sep"></span>
          <button class="mini-btn primary" id="saveDraft">保存</button><span class="sep"></span>
          <button class="img-mode on" id="imgMode">含灵感</button><span class="sep"></span>
          <button class="img-mode on" id="logoMode">署名·有</button><span class="sep"></span>
          <button class="mini-btn" id="fontSizeBtn">字号·中</button>
          <button class="mini-btn" id="fontKeyBtn">字体·默认</button><span class="sep"></span>
          <span id="charCount">0 字</span>
        </span>
      </div>
      <div class="fmt" id="fmt">
        <button data-cmd="bold" title="加粗"><b>B</b></button>
        <button data-cmd="italic" title="斜体"><i>I</i></button>
        <button data-cmd="underline" title="下划线"><u>U</u></button>
        <span class="vline"></span>
        <button data-cmd="formatBlock" data-value="H2" title="大标题" class="ttl ttl1">H1</button>
        <button data-cmd="formatBlock" data-value="H3" title="小标题" class="ttl ttl2">H2</button>
        <span class="vline"></span>
        <button data-cmd="justifyLeft" title="左对齐"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="10" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg></button>
        <button data-cmd="justifyCenter" title="居中"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg></button>
        <button data-cmd="justifyRight" title="右对齐"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg></button>
        <span class="vline"></span>
        <button data-cmd="insertUnorderedList" title="列表"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="3" cy="4" r="1" fill="currentColor"/><line x1="6" y1="4" x2="14" y2="4"/><circle cx="3" cy="8" r="1" fill="currentColor"/><line x1="6" y1="8" x2="14" y2="8"/><circle cx="3" cy="12" r="1" fill="currentColor"/><line x1="6" y1="12" x2="14" y2="12"/></svg></button>
        <button data-cmd="removeFormat" title="清除格式" class="ttl ttl2" style="font-family:var(--font);">Tx</button>
      </div>
      <div class="editor" id="editor" contenteditable="true" data-placeholder="写下你的故事…"></div>
    </section>
  </div>
</div>

<div class="actions">
  <div class="actions-inner">
    <button class="btn btn-primary" id="roll">再 摇 一 次</button>
    <button class="btn btn-ghost" id="copy">复 制</button>
    <button class="btn btn-ghost" id="saveImg">存 图</button>
    <button class="btn btn-ghost" id="exportDoc">导 出</button>
  </div>
</div>

<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-title">我的草稿</span>
    <div class="drawer-head-actions">
      <button class="drawer-new" id="newNote">新建</button>
      <button class="drawer-close" id="closeDrawer">×</button>
    </div>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</aside>

<div class="lib-modal" id="libModal">
  <div class="lib-panel">
    <div class="lib-head">
      <span class="lib-title">自定义词库</span>
      <button class="lib-close" id="libClose">×</button>
    </div>
    <div class="lib-types" id="libTypes"></div>
    <div class="lib-pools" id="libPools"></div>
    <div class="lib-body">
      <div class="lib-input-wrap">
        <textarea class="lib-input" id="libInput" placeholder="输入要添加的词条，一行一个；支持逗号、分号分隔"></textarea>
        <button class="lib-add" id="libAdd">添加</button>
      </div>
      <div class="lib-hint">
        <span>共 <b id="libCount">0</b> 条自定义词条</span>
        <button class="lib-clear" id="libClear">清空当前池</button>
      </div>
      <div class="lib-list" id="libList"></div>
    </div>
  </div>
</div>

<div class="imgcfg-modal" id="imgcfgModal">
  <div class="imgcfg-panel">
    <div class="imgcfg-head">
      <span class="imgcfg-title">存图设置</span>
      <button class="imgcfg-close" id="imgcfgClose">×</button>
    </div>
    <p class="imgcfg-sub">所见即所得 · 换背景/字体后点「生成图片」</p>
    <div class="imgcfg-preview" id="imgcfgPreview"><canvas id="imgcfgCanvas"></canvas></div>
    <div class="imgcfg-label">背景</div>
    <div class="imgcfg-bgs" id="bgsList"></div>
    <div class="imgcfg-actions">
      <button class="imgcfg-cancel" id="imgcfgCancel">取消</button>
      <button class="imgcfg-go" id="imgcfgGo">生成图片</button>
    </div>
  </div>
</div>

<div class="export-modal" id="exportModal">
  <div class="export-panel">
    <div class="export-head">
      <span class="export-title">导出为文档</span>
      <button class="export-close" id="exportClose">×</button>
    </div>
    <p class="export-sub">灵感部分随「含灵感」开关同步</p>
    <div class="export-opts">
      <button class="export-opt" data-fmt="txt"><span class="ico">TXT</span><span class="info"><span class="lbl">纯文本</span><span class="desc">任何设备、任何软件都能打开</span></span></button>
      <button class="export-opt" data-fmt="md"><span class="ico">MD</span><span class="info"><span class="lbl">Markdown</span><span class="desc">保留标题层级，方便排版与发布</span></span></button>
      <button class="export-opt" data-fmt="doc"><span class="ico">DOC</span><span class="info"><span class="lbl">Word 文档</span><span class="desc">可用 Word、WPS、Pages 打开</span></span></button>
    </div>
  </div>
</div>

<div class="confirm-modal" id="confirmModal">
  <div class="confirm-box">
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="confirmCancel">取消</button>
      <button class="confirm-ok" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="loading-box"><span class="spin"></span><span id="loadingText">正在生成图片…</span></div></div>
<div class="modal" id="modal">
  <div class="modal-inner">
    <img id="previewImg" alt="偶得便签">
    <p class="modal-tip">长按图片保存 · 或点下方按钮下载</p>
    <div class="modal-actions">
      <a class="m-primary" id="downloadLink" download>下载图片</a>
      <button class="m-sub" id="closeModal">关闭</button>
    </div>
  </div>
</div>

openings:["凌晨两点，我还在改不知道第几版的方案。","手机弹出一条提醒：您的房贷已逾期。","地铁上，我收到一条陌生号码的短信。","合租房的隔断墙很薄，我听见隔壁在哭。","离职申请提交的那一刻，我手抖了。","同学聚会上，没有人提起他的名字。","我在相亲软件上划到了高中同桌。","外卖备注栏里，写着一行奇怪的话。","加班的第三十七天，公司楼下的便利店关门了。","我在医院的缴费窗口，见到了前任。","搬家那天，我在床底找到一张车票。","母亲在电话里说：你爸最近不太对劲。","面试官翻着我的简历，皱了皱眉。","凌晨的急诊室，只有我和一个醉汉。","我把那条微信删了又打，打了又删。","除夕夜，我一个人在出租屋煮了碗面。","毕业那天，宿舍的钥匙我没还。","他的朋友圈，停在三个月前。","我在超市遇见了她，她推着婴儿车。","这城市太大了，大到可以彻底消失。","房东发来微信，说下个月要涨租。","周一早上八点，地铁里挤满了人。","加班到凌晨两点，公司只剩我一个人。","我把辞职信写好，又删掉了。","她在微信上说：我们冷静一下吧。","相亲对象说了一句让我没听懂的话。","我在外卖软件上，看到那家店已经打烊了。","毕业五年后，我收到了一条群发的婚礼邀请。","合租的室友搬走了，房间一下子空了。","手机上弹出花呗的还款提醒。"],
endings:["后来我搬了三次家，再没见过他。","我把那条微信，永远留在了草稿箱。","第二天，我照常去上班了。","房贷还有二十三年。","我关掉手机，睡了过去。","她再也没回过我的消息。","我把那碗面吃完了。","地铁到站，我下了车。","而这座城市，一如既往。","我终于把工牌交了回去。","出租屋的灯，最后也没修。","我在他的朋友圈下，点了赞。","后来我把那件旧外套扔了。","我们只是，在人群里走散了。","那天之后，我学会了报喜不报忧。","我删掉了所有聊天记录。","我再也没有点过那家的外卖。","生活继续，只是少了一个人。","第二天，我换了手机号。","我没有哭，只是有点累。","周一照常上班，好像什么都没发生过。","我把那件旧工牌收进了抽屉。","后来那套合租房，又住进了新的人。","房贷还要还十八年。","我在回家的地铁上，删掉了他的号码。","第二天，我向公司递了辞职信。","月底的工资条上，少了两千块。","那年之后，我再也没回老家过春节。","我把体检报告塞进了抽屉最底下。","她的朋友圈，我再也看不到了。"]
},

openings:["长亭外，风卷起半幅残旗。","那一夜，长安城下了第一场雪。","她将簪子放在桌上，转身出门。","师父临终前，只留给我半句话。","宫宴散后，长廊只剩一盏灯。","我在城门外等到天明，他没有来。","刀锋抵住咽喉的那一刻，我想起了家。","那年的杏花开得很好。","三更时分，有人叩响了柴门。","他自江南来，带了一封旧信。","朝堂之上，无人敢应声。","将军出征那日，她没有去送。","我在古刹避雨，遇见了十年前的人。","那坛酒埋了十七年。","她的琴断了最后一根弦。","御赐的婚书，他始终没有拆。","我这一生，只跪过三次。","那封信，我写了又烧，烧了又写。","江湖传言，他已死了三年。","元宵灯会上，我认错了人。","那年的雪，落得比哪一年都厚。","我最后一次见他，是在江南的渡口。","她递给我半块虎符，什么也没说。","刀落下的时候，他闭上了眼睛。","城破了，王还在城楼上。","我在旧书肆里，翻到一封退婚书。","她进宫那年，才十六岁。","江湖上都在传，他已死在了塞外。","酒过三巡，他终于说了那件事。","长安的雪下了三天，城里却没有一个人。"],
endings:["后来她再未抚琴。","而那把剑，从此封在匣中。","我终究没能等到他回来。","长安城依旧，只是换了人间。","她这一生，未再嫁人。","那坛酒，最后也没能喝上。","我把信烧了。","城门开了，我们却走散了。","江湖再无他的消息。","雪落满了长亭。","他终于跪下了。","我只带走了一枝杏花。","此后山高水远，各自珍重。","师父的话，我到死才懂。","那把断琴，我留在了江南。","朝堂依旧，故人已远。","我举杯，敬了一杯无人的酒。","她说：来世不入帝王家。","从此，我再未踏足长安。","灯灭了，人也散了。","那把剑，我替他埋在了当年那棵杏树下。","她这一生，只哭了那一次。","长安城的雪，再没下过第二场。","那封信，到死我都没有拆开。","满城灯火，却没有一盏为他而亮。","从那天起，他再不佩剑。","将军百战，终于回到了故里。","他登基那日，她已在城外剃度为尼。","后来的事，史书上只写了四个字。","那坛酒，我们谁都没再提起。"]
},

openings:["满月升起时，村口的钟自己响了。","我在酒馆里，接下了这辈子最蠢的委托。","龙焰烧尽的那天，天空是紫色的。","他摘下手套，露出掌心的烙印。","神的谕旨，是用血写在羊皮上的。","王城的钟敲了十三下。","我在古堡的舞会上，见到了她。","那把剑在架上，等了七百年。","商队没有从黑森林里出来。","我的名字，被写进了预言。","加冕那日，他没有笑。","精灵的森林正在退潮。","他递给我一枚戒指，说：别摘下来。","我出卖了灵魂，换了一夜的月光。","塔楼最高层，锁着一个人。","瘟疫来得比春天还早。","骑士的誓约，是用命换的。","我听见了龙的哭声。","血月升起的那一刻，所有的钟都停了。","我在古塔的顶层，找到了失踪的王子。","预言说，第七个孩子会终结这一切。","那把剑在月光下，发出低低的嗡鸣。","神谕是从天而降的，落在一座孤岛上。","他披上斗篷，走进了黑森林。","龙焰烧尽村庄的那天，我正好路过。","我在酒馆里遇见了她，她已不是人。","妖精的集市上，有人用一个吻换走了一切。","古堡的门开了，里面空无一人。","王座上坐着一具骷髅，王冠还在头上。","最后一头龙死的那天，下了大雪。"],
endings:["从此，再没人见过那座塔。","而那把剑，始终没有出鞘。","预言应验了，一个字都没错。","他成了王，也成了囚徒。","我摘下戒指，天就亮了。","龙死之后，山就再没下过雪。","我们的契约，到此为止。","她回了森林，再没出来。","王城恢复了宁静。","而我，记住了他的名字。","酒馆里的故事，传了三百年。","他终究没有回头。","神的谕旨，被烧成了灰。","我把他埋在了黑森林边缘。","满月落下，一切归于寂静。","从此我不再相信预言。","骑士放下了剑。","那片大陆，再没有钟声。","最后一个龙裔，死在了黎明之前。","从此那片森林，再无妖精出没。","预言应验了，而代价是他的命。","王座空了三百年，直到新的血脉归来。","那把剑终于出鞘，斩断了所有诅咒。","诸神黄昏之后，人间迎来了第一缕晨光。","古塔倒了，塔下的封印也就散了。","妖精的集市，从此再没开过。","他戴上王冠，眼里却一片死寂。","神殿的钟敲了七下，然后是长久的寂静。","我从黑森林走出来，再也不是从前那个人。","龙焰熄灭之后，天空恢复了蓝色。"]

function formatDate(ts){const d=new Date(ts),now=new Date();
if(d.toDateString()===now.toDateString())return`今天 ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const y=new Date(now);y.setDate(now.getDate()-1);
if(d.toDateString()===y.toDateString())return`昨天 ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
if(d.getFullYear()===now.getFullYear())return`${d.getMonth()+1}月${d.getDate()}日`;
return`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;}

/* 生成关键词 */
function rollKeywords(){
const pools=[getPool(typeKey,'objects'),getPool(typeKey,'actions'),getPool(typeKey,'abstracts'),getPool(typeKey,'times')].map(shuffle);
const ptr=[0,0,0,0],order=shuffle([0,1,2,3]),used=new Set(),next=new Array(count).fill(null);
for(let i=0;i<count;i++){if(locks[i]&&words[i]&&!used.has(words[i])){next[i]=words[i];used.add(words[i]);}}
const takeFrom=pi=>{const p=pools[pi];while(ptr[pi]<p.length){const c=p[ptr[pi]++];if(!used.has(c))return c;}return null;};
let k=0;
for(let i=0;i<count;i++){if(next[i])continue;
let w=null;for(let t=0;t<4&&!w;t++)w=takeFrom(order[(k+t)%4]);
if(!w){const all=pools[0].concat(pools[1],pools[2],pools[3]);
for(let t=0;t<60&&!w;t++){const c=pick(all);if(!used.has(c))w=c;}
if(!w&&all.length)w=pick(all);}
k++;
if(w!==null){next[i]=w;used.add(w);}else next[i]='（无词条）';}
words=next;}

/* 图片绘制公共函数 */
function roundRect(ctx,x,y,w,h,r){if(w<2*r)r=w/2;if(h<2*r)r=h/2;
ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function measureWrapped(ctx,text,maxW,font){ctx.font=font;const lines=[];let cur='';
for(const ch of text){if(ch==='\n'){lines.push(cur);cur='';continue;}
const t=cur+ch;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=ch;}else cur=t;}
lines.push(cur);return lines;}
function extractParagraphs(root){const paras=[];
const BLOCKS=['DIV','P','UL','OL','LI','H1','H2','H3','H4','H5','H6','BLOCKQUOTE'];
const hasBlock=Array.from(root.children).some(c=>BLOCKS.includes(c.tagName));
if(!hasBlock){const frags=[];collectInline(root,{},frags);
if(frags.some(f=>f.text&&f.text.trim()))paras.push({align:'left',frags,heading:null});return paras;}
for(const child of root.childNodes){
if(child.nodeType===3){const t=child.textContent;
if(t&&t.trim())paras.push({align:'left',frags:[{text:t,bold:false,italic:false,underline:false}],heading:null});}
else if(child.nodeType===1){const tag=child.tagName;
if(tag==='UL'||tag==='OL'){for(const li of child.children){
const frags=[{text:'· ',bold:false,italic:false,underline:false}];collectInline(li,{},frags);
paras.push({align:'left',frags,heading:null});}}
else if(tag==='BR')paras.push({align:'left',frags:[],heading:null});
else{let align='left';const sa=child.style&&child.style.textAlign;
if(sa==='center'||sa==='right')align=sa;
const frags=[];collectInline(child,{},frags);let heading=null;
if(tag==='H1'||tag==='H2'||tag==='H3')heading=tag;
paras.push({align,frags,heading});}}}
return paras;}
function collectInline(node,style,out){
if(node.nodeType===3){const t=node.textContent;
if(t)out.push({text:t,bold:!!style.bold,italic:!!style.italic,underline:!!style.underline});return;}
if(node.nodeType!==1)return;
const tag=node.tagName;
if(tag==='BR'){out.push({text:'\n',bold:false,italic:false,underline:false});return;}
const s={bold:!!style.bold,italic:!!style.italic,underline:!!style.underline};
if(tag==='B'||tag==='STRONG')s.bold=true;
if(tag==='I'||tag==='EM')s.italic=true;
if(tag==='U')s.underline=true;
for(const c of node.childNodes)collectInline(c,s,out);}
const HEADING_RATIO={'H1':{size:1.7,lineH:1.8,bold:true},'H2':{size:1.38,lineH:1.5,bold:true},'H3':{size:1.18,lineH:1.3,bold:true}};
function layoutNoteLines(ctx,paras,maxW,baseSize,baseLineH,family){
const lines=[];
for(const para of paras){
let size=baseSize,lineH=baseLineH,forceBold=false;
if(para.heading&&HEADING_RATIO[para.heading]){const r=HEADING_RATIO[para.heading];
size=Math.round(baseSize*r.size);lineH=Math.round(baseLineH*r.lineH);forceBold=!!r.bold;}
let cur={align:para.align,items:[],width:0,lineH};
for(const frag of para.frags){if(!frag.text)continue;
const parts=[];if(frag.italic)parts.push('italic');
if(frag.bold||forceBold)parts.push('700');
parts.push(size+'px');parts.push(family);
const font=parts.join(' ');ctx.font=font;
for(const ch of frag.text){if(ch==='\n'){lines.push(cur);cur={align:para.align,items:[],width:0,lineH};continue;}
const w=ctx.measureText(ch).width;
if(cur.width+w>maxW&&cur.items.length>0){lines.push(cur);cur={align:para.align,items:[],width:0,lineH};}
cur.items.push({ch,w,font,size,underline:!!frag.underline});cur.width+=w;}}
lines.push(cur);}
return lines;}
function drawNoteLines(ctx,lines,x,y,maxW,color){
let cy=y;ctx.textBaseline='middle';
for(const line of lines){const lineH=line.lineH||58;
let drawX;
if(line.align==='center')drawX=x+(maxW-line.width)/2;
else if(line.align==='right')drawX=x+maxW-line.width;
else drawX=x;
const cyMid=cy+lineH/2;
for(const item of line.items){ctx.font=item.font;ctx.fillStyle=color;ctx.textAlign='left';
ctx.fillText(item.ch,drawX,cyMid);
if(item.underline){const sz=item.size||32;ctx.fillRect(drawX,cyMid+sz*0.36,item.w,2);}
drawX+=item.w;}
cy+=lineH;}
return cy;}

function buildCardCanvas(W){

fg:bg.fg,muted:bg.muted,accent:bg.accent,noteBg:bg.noteBg,line:bg.line,bgStart:bg.bgStart,bgEnd:bg.bgEnd,

if(mode==='keywords'){inspBlock={type:'keywords',items:words.slice(),height:words.length*S.inspLineH};}
else{const font=`600 ${S.sentSize}px ${fam}`;

const paras=extractParagraphs(editor);
const hasContent=paras.some(p=>p.frags.some(f=>f.text&&f.text.trim()));
let noteLines=null,noteInnerH=S.noteLineH;
if(hasContent){noteLines=layoutNoteLines(mctx,paras,CONTENT_W-S.noteBarW-S.notePadX*2,S.noteSize,S.noteLineH,fam);
noteInnerH=0;for(const l of noteLines)noteInnerH+=(l.lineH||S.noteLineH);}
const noteBlockH=noteInnerH+S.notePadY*2;

const headerH=showLogo?Math.round(S.titleSize*1.15):0;
let y=PAD;
if(showLogo)y+=headerH;
if(includeInsp)y+=S.gapHeader+inspBlock.height+S.gapInsp+S.lineThick+S.gapLine;
else y+=S.gapOnlyNote;
y+=noteBlockH+S.gapFooter+S.footerSize*1.2+PAD;
const H=Math.ceil(y);

const canvas=document.createElement('canvas');
canvas.width=W;canvas.height=H;
const ctx=canvas.getContext('2d');
const grad=ctx.createLinearGradient(0,0,W*0.55,H);
grad.addColorStop(0,S.bgStart);grad.addColorStop(1,S.bgEnd);
ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

if(showLogo){ctx.textBaseline='middle';
const titleCY=PAD+headerH/2;
ctx.textAlign='left';ctx.font=`700 ${S.titleSize}px ${fam}`;ctx.fillStyle=S.accent;
ctx.fillText(BRAND,PAD,titleCY);
ctx.textAlign='right';ctx.font=`${S.metaSize}px ${fam}`;ctx.fillStyle=S.muted;
ctx.fillText(includeInsp?modeName:'便签',W-PAD,titleCY);}

let ny;
if(includeInsp){const iy=PAD+headerH+S.gapHeader;
if(inspBlock.type==='keywords'){ctx.textAlign='left';
const kwFont=`700 ${S.inspSize}px ${fam}`;
for(let i=0;i<inspBlock.items.length;i++){
const cyMid=iy+i*S.inspLineH+S.inspLineH/2;
ctx.beginPath();ctx.arc(PAD+S.dotX,cyMid,S.dotR,0,Math.PI*2);ctx.fillStyle=S.accent;ctx.fill();
ctx.font=kwFont;ctx.fillStyle=S.fg;
ctx.fillText(inspBlock.items[i],PAD+S.textOffsetX,cyMid);}}
else{ctx.textAlign='center';ctx.font=inspBlock.font;ctx.fillStyle=S.fg;
for(let i=0;i<inspBlock.lines.length;i++){
const cyMid=iy+i*S.sentLineH+S.sentLineH/2;
ctx.fillText(inspBlock.lines[i],W/2,cyMid);}}
const ly=iy+inspBlock.height+S.gapInsp;
const lg=ctx.createLinearGradient(PAD,0,W-PAD,0);
lg.addColorStop(0,S.line.replace(/[\d.]+\)$/,'0)'));
lg.addColorStop(0.5,S.line);
lg.addColorStop(1,S.line.replace(/[\d.]+\)$/,'0)'));
ctx.fillStyle=lg;ctx.fillRect(PAD,ly,CONTENT_W,S.lineThick);
ny=ly+S.lineThick+S.gapLine;}
else ny=PAD+headerH+S.gapOnlyNote;

ctx.save();roundRect(ctx,PAD,ny,CONTENT_W,noteBlockH,S.radius);ctx.clip();
ctx.fillStyle=S.noteBg;ctx.fillRect(PAD,ny,CONTENT_W,noteBlockH);
ctx.fillStyle=S.accent;ctx.fillRect(PAD,ny,S.noteBarW,noteBlockH);
ctx.restore();

const noteTextX=PAD+S.noteBarW+S.notePadX;
const noteTextY=ny+S.notePadY;
const noteTextW=CONTENT_W-S.noteBarW-S.notePadX*2;

if(noteLines){drawNoteLines(ctx,noteLines,noteTextX,noteTextY,noteTextW,S.fg);}
else{ctx.textBaseline='middle';ctx.textAlign='left';
ctx.font=`italic ${S.noteSize}px ${fam}`;ctx.fillStyle=S.muted;
ctx.fillText('（还没有写下内容）',noteTextX,noteTextY+S.noteLineH/2);}

const fy=ny+noteBlockH+S.gapFooter+S.footerSize*0.6;
ctx.textBaseline='middle';ctx.font=`${S.footerSize}px ${fam}`;ctx.fillStyle=S.muted;
ctx.textAlign='left';ctx.fillText(dateStr,PAD,fy);
if(showLogo){ctx.textAlign='right';ctx.fillText(BRAND,W-PAD,fy);}
return canvas;}

/* 实时预览 */
function renderPreview(){try{
const src=buildCardCanvas(720);
imgcfgCanvas.width=src.width;imgcfgCanvas.height=src.height;
const pctx=imgcfgCanvas.getContext('2d');
pctx.clearRect(0,0,src.width,src.height);
pctx.drawImage(src,0,0);}catch(e){console.warn('preview fail',e);}}

/* 存图设置面板 */
function openImgcfg(){renderBgs();imgcfgModalEl.classList.add('show');
requestAnimationFrame(()=>requestAnimationFrame(renderPreview));}
function closeImgcfg(){imgcfgModalEl.classList.remove('show');}
$('saveImg').addEventListener('click',openImgcfg);
$('imgcfgClose').addEventListener('click',closeImgcfg);
$('imgcfgCancel').addEventListener('click',closeImgcfg);
imgcfgModalEl.addEventListener('click',e=>{if(e.target===imgcfgModalEl)closeImgcfg();});
$('imgcfgGo').addEventListener('click',async()=>{closeImgcfg();
await new Promise(r=>setTimeout(r,180));saveImage();});

/* 生成图片 */
let previewUrl=null;
async function saveImage(){showLoading('正在生成图片…');
try{
const canvas=buildCardCanvas(1080);
const blob=await new Promise((res,rej)=>{
try{canvas.toBlob(b=>b?res(b):rej(new Error('导出失败')),'image/png');}catch(e){rej(e);}});
if(previewUrl)URL.revokeObjectURL(previewUrl);
previewUrl=URL.createObjectURL(blob);
const n=new Date();
const prefix=includeInsp?BRAND:'便签';
const name=`${prefix}_${n.getFullYear()}${pad2(n.getMonth()+1)}${pad2(n.getDate())}_${pad2(n.getHours())}${pad2(n.getMinutes())}.png`;
previewImg.src=previewUrl;dlLink.href=previewUrl;dlLink.download=name;
modalEl.classList.add('show');
}catch(e){console.error('生成失败:',e);showToast('生成失败：'+(e.message||'请重试'));}
finally{hideLoading();}}

$('closeModal').addEventListener('click',()=>modalEl.classList.remove('show'));
modalEl.addEventListener('click',e=>{if(e.target===modalEl)modalEl.classList.remove('show');});
$('roll').addEventListener('click',()=>{roll();if(navigator.vibrate)navigator.vibrate(12);});
$('copy').addEventListener('click',doCopy);

document.addEventListener('keydown',e=>{
const el=document.activeElement,tag=el&&el.tagName,inEditor=editor.contains(el);
if((e.code==='Space'||e.code==='Enter')&&tag!=='BUTTON'&&tag!=='TEXTAREA'&&tag!=='INPUT'&&!inEditor){
e.preventDefault();roll();}
if(e.key==='Escape'){
if(confirmModalEl.classList.contains('show'))confirmCancelEl.click();
else if(imgcfgModalEl.classList.contains('show'))closeImgcfg();
else if(exportModalEl.classList.contains('show'))closeExport();
else if(libModalEl.classList.contains('show'))closeLib();
else if(drawerEl.classList.contains('show'))closeDrawer();}});

/* 初始化 */
typesEl.querySelector('button[data-type="general"]').classList.add('active');
countsEl.querySelector('button[data-n="4"]').classList.add('active');
/* 从存储恢复 */
(function restore(){
try{const v=localStorage.getItem(FONT_LEVEL_KEY);if(v&&FONT_LEVELS.includes(v))applyFontLevel(v);else applyFontLevel('m');}catch(e){applyFontLevel('m');}
try{const v=localStorage.getItem(FONT_KEY_STORAGE);if(v&&FONT_KEYS.includes(v))applyFontKey(v);else applyFontKey('default');}catch(e){applyFontKey('default');}
try{const v=localStorage.getItem(LOGO_KEY);if(v==='0')showLogo=false;}catch(e){}
updateLogoUI();
try{const v=localStorage.getItem(IMG_MODE_KEY);if(v==='0')includeInsp=false;}catch(e){}
updateImgModeUI();
try{const v=localStorage.getItem(BG_KEY);if(v&&BG_PRESETS.some(b=>b.id===v))bgId=v;}catch(e){}
renderBgs();
})();
loadDrafts();renderDrafts();updateDraftCount();
editor.innerHTML='';updateCharCount();statusEl.classList.remove('on');
updateInspHint();
roll();
</script>
</body>
</html>
